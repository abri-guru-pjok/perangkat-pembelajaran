:root{--navy:#0b2a6f;--blue:#1560d6;--gold:#f5b800;--red:#d62828;--bg:#eef3fb;--card:#fff;--tx:#18233f}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
.hidden{display:none!important}
.app{display:flex;min-height:100vh}
.side{width:270px;background:linear-gradient(180deg,var(--navy),#12409c);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{display:flex;gap:10px;align-items:center;padding:16px;border-bottom:1px solid #ffffff30}
.brand .logo{width:54px;height:54px;border-radius:50%;object-fit:cover;background:#fff}
.brand small{display:block;opacity:.8;font-size:11px}
nav{flex:1;overflow:auto;padding:8px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#fff;padding:11px 12px;border-radius:10px;cursor:pointer;font-size:14px;margin-bottom:2px}
nav button:hover{background:#ffffff1f}
nav button.on{background:var(--gold);color:#201a00;font-weight:700}
.side-foot{padding:12px;font-size:12px;border-top:1px solid #ffffff30}
.status{opacity:.85;margin-bottom:6px}
.main{flex:1;padding:20px;min-width:0}
.burger{display:none;margin-bottom:10px}
h1{margin:0 0 4px;color:var(--navy)}
.sub{margin:0 0 16px;color:#52607f}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 2px 10px #0b2a6f14}
.card h3{margin-top:0;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
label{display:block;font-size:12px;font-weight:600;color:#40507a;margin-bottom:3px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid #c5d0e6;border-radius:8px;font:inherit;background:#fff}
textarea{min-height:80px}
.btn{background:#e6edfb;color:var(--navy);border:1px solid #c5d0e6;border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn:hover{filter:brightness(.96)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#201a00}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.red{background:#fde8e8;color:var(--red);border-color:#f5bcbc}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.hint{font-size:12px;color:#66749a;margin:6px 0}
.paper{background:#fff;border:1px dashed #9db3e0;padding:18px;overflow:auto;max-height:70vh;font-family:'Times New Roman',serif;font-size:13px}
.paper table{border-collapse:collapse;width:100%}
.paper td,.paper th{border:1px solid #000;padding:4px;vertical-align:top}
.paper th{background:#d9e2f3}
.paper table.nb td,.paper table.nb th{border:none;background:none}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{border:1px solid #d3dcf0;padding:4px}
.tbl th{background:#eaf0fc;font-size:12px}
.tbl input,.tbl select,.tbl textarea{padding:5px;min-height:0}
.tbl textarea{height:56px}
.scroll{overflow:auto}
.imgprev{height:60px;border:1px solid #ccd;border-radius:6px;background:#fafafa;margin-top:4px;display:block}
.files{font-size:13px}
.files div{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid #eef}
.wk{display:inline-block;min-width:30px;padding:5px 0;margin:1px;border-radius:6px;border:1px solid #bcd;background:#e9fbe9;cursor:pointer;text-align:center;font-size:12px}
.wk.off{background:#999;color:#fff}
.auth{position:fixed;inset:0;background:linear-gradient(160deg,var(--navy),var(--blue));display:grid;place-items:center;z-index:9}
.auth .box{background:#fff;padding:26px;border-radius:16px;width:min(380px,92vw)}
.err{color:var(--red);font-size:13px}
.warn{background:#fff6d6;border:1px solid #f0d36b;padding:8px 10px;border-radius:8px;font-size:13px}
@media(max-width:820px){.side{position:fixed;left:-290px;z-index:5;transition:left .2s}.side.open{left:0}.burger{display:block}}

.kelasbox{padding:10px 16px;border-bottom:1px solid #ffffff30}.kelasbox label{color:#fff;opacity:.85}.kelasbox select{font-weight:700}
</style>

/* ---------- Kaldik / minggu efektif ---------- */
function kaldikCalc() {
  const jpm = +S.kaldik.jpm || 0;
  const rows = S.kaldik.rows.map(r => { const ef = Math.max(0, (+r.total || 0) - (+r.libur || 0)); return { ...r, ef, jam: ef * jpm }; });
  const sum = (a, b) => rows.slice(a, b).reduce((x, r) => ({ total: x.total + (+r.total || 0), libur: x.libur + (+r.libur || 0), ef: x.ef + r.ef, jam: x.jam + r.jam }), { total: 0, libur: 0, ef: 0, jam: 0 });
  return { rows, s1: sum(0, 6), s2: sum(6, 12), jpm };
}

const weekOff = (mi, w) => { const r = S.kaldik.rows[mi], k = mi + '-' + w, v = S.promes.off[k]; return v === 1 ? true : v === 0 ? false : w > (+r.total || 0) - (+r.libur || 0); };
function alloc(sem) {
  const [a, b] = semRange(sem), jpm = +S.kaldik.jpm || 1;
  const items = sortedTp(sem).map(t => ({ label: `${esc(t.materi || '')}<br><small>${esc(t.tp || '')}</small>`, jp: +t.jp || 0, cells: {} }));
  items.push({ label: 'Asesmen Sumatif', jp: +S.kaldik['asm' + sem] || 0, cells: {} }, { label: 'Cadangan (Pengayaan/Remedial)', jp: +S.kaldik['cad' + sem] || 0, cells: {} });
  let q = 0, left = items[0] ? items[0].jp : 0;
  const weeks = [];
  for (let mi = a; mi < b; mi++) for (let w = 1; w <= Math.min(5, +S.kaldik.rows[mi].total || 0); w++) {
    const off = weekOff(mi, w); weeks.push({ mi, w, off });
    if (off) continue;
    let cap = jpm;
    while (cap > 0 && q < items.length) {
      if (left <= 0) { q++; left = items[q] ? items[q].jp : 0; continue; }
      const take = Math.min(cap, left); const k = mi + '-' + w;
      items[q].cells[k] = (items[q].cells[k] || 0) + take; cap -= take; left -= take;
    }
  }
  let rest = 0; for (let j = q; j < items.length; j++) rest += (j === q ? left : items[j].jp);
  return { items, weeks, rest, a, b };
}

function loadScript(src) { return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('Gagal memuat pustaka pembaca berkas')); document.head.appendChild(s); }); }
async function extractText(file) {
  const n = file.name.toLowerCase();
  if (/\.(txt|md)$/.test(n)) return await file.text();
  if (n.endsWith('.docx')) {
    if (!window.mammoth) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
    return (await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() })).value;
  }
  if (n.endsWith('.pdf')) {
    if (!window.pdfjsLib) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise; let t = '';
    for (let i = 1; i <= Math.min(pdf.numPages, 150); i++) { const c = await (await pdf.getPage(i)).getTextContent(); t += c.items.map(x => x.str + (x.hasEOL ? '\n' : ' ')).join('') + '\n'; }
    return t;
  }
  return '';
}

/* ---------- Upload berkas ---------- */
function parseCSV(text) {
  const d = text.split('\n')[0].includes(';') ? ';' : ',';
  return text.replace(/\r/g, '').split('\n').filter(l => l.trim()).map(l => { const r = []; let c = '', q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === d && !q) { r.push(c.trim()); c = ''; } else c += ch; } r.push(c.trim()); return r; });
}
function importRows(menu, rows) {
  const dataRows = /^[a-z]/i.test(rows[0]?.[0] || '') && isNaN(+rows[0][1]) ? rows.slice(1) : rows;
  if (menu === 'atp') dataRows.forEach(r => S.tp.push({ sem: r[0] || '1', elemen: r[1] || ELEMEN[0], materi: r[2] || '', tp: r[3] || '', jp: +r[4] || 4, dimensi: r[5] || '' }));
  if (menu === 'kaldik') dataRows.forEach((r, i) => { if (S.kaldik.rows[i]) { S.kaldik.rows[i].total = +r[1] || S.kaldik.rows[i].total; S.kaldik.rows[i].libur = +r[2] || 0; } });
  if (menu === 'jurnal') dataRows.forEach(r => S.jurnal.push({ tgl: r[0] || '', jam: r[1] || '', kelas: r[2] || '', pert: r[3] || '', materi: r[4] || '', absen: r[5] || '', tuntas: r[6] || '', kendala: r[7] || '', tl: r[8] || '' }));
  return dataRows.length;
}
async function handleUpload(menu, file) {
  let msg = '';
  if (/\.csv$/i.test(file.name) && ['atp', 'kaldik', 'jurnal'].includes(menu)) msg = ` ${importRows(menu, parseCSV(await file.text()))} baris diimpor.`;
  if (/\.(pdf|docx|txt|md)$/i.test(file.name) && ['atp', 'modul', 'soal'].includes(menu)) {
    try { setStatus('Membaca isi berkas…'); const t = await extractText(file); if (t.trim()) { S.bahan = { nama: file.name, teks: t.replace(/\r/g, '').slice(0, 60000) }; msg = ` Teks terbaca (${t.length} karakter) dan dipakai sebagai bahan ajar.`; } else msg = ' Teks tidak terbaca (mungkin PDF hasil pindai/scan).'; } catch (e) { msg = ' Gagal membaca isi berkas: ' + e.message; }
  }
  const entry = { menu, name: file.name, path: '' };
  if (sb && user) {
    const path = `${user.id}/${menu}/${Date.now()}_${file.name.replace(/[^\w.\-]/g, '_')}`;
    const { error } = await sb.storage.from('berkas').upload(path, file);
    if (error) alert('Upload ke Supabase gagal: ' + error.message); else entry.path = path;
  }
  S.files.push(entry); save(); render(); alert('Berkas "' + file.name + '" tersimpan.' + msg);
}

/* ---------- Download Word (MHTML, gambar ikut tertanam) ---------- */
const b64 = s => btoa(unescape(encodeURIComponent(s)));
function toWord(title, html, land) {
  const parts = []; let n = 0;
  html = html.replace(/src="data:(image\/[a-z+]+);base64,([^"]+)"/g, (m, t, d) => { const nm = 'img' + (n++) + '.' + t.split('/')[1].replace('+xml', ''); parts.push({ nm, t, d }); return `src="${nm}"`; });
  html = html.replace(/<table\s*>/g, '<table border="1" cellspacing="0" cellpadding="4" style="border-collapse:collapse;width:100%">').replace(/<table class="nb"/g, '<table class="nb" border="0" cellspacing="0" cellpadding="2"');
  const page = land ? 'size:841.9pt 595.3pt;mso-page-orientation:landscape;margin:56pt 56pt 56pt 56pt' : 'size:595.3pt 841.9pt;margin:56pt 56pt 56pt 56pt';
  const doc = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${title}</title><style>@page WordSection1{${page}}div.WordSection1{page:WordSection1}body{font-family:'Times New Roman';font-size:12pt}table{border-collapse:collapse;width:100%}td,th{border:1px solid #000;padding:4px;vertical-align:top}th{background:#d9e2f3}table.nb td,table.nb th{border:none;background:none}</style></head><body><div class="WordSection1">${html}</div></body></html>`;
  const B = '----=_NextPart_pjok';
  let out = `MIME-Version: 1.0\r\nContent-Type: multipart/related; boundary="${B}"; type="text/html"\r\n\r\n--${B}\r\nContent-Type: text/html; charset="utf-8"\r\nContent-Transfer-Encoding: base64\r\nContent-Location: file:///doc.htm\r\n\r\n${b64(doc)}\r\n`;
  parts.forEach(p => { out += `--${B}\r\nContent-Type: ${p.t}\r\nContent-Transfer-Encoding: base64\r\nContent-Location: file:///${p.nm}\r\n\r\n${p.d}\r\n`; });
  out += `--${B}--`;
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([out], { type: 'application/msword' }));
  a.download = `${title}_Kelas${S.cp.kelas}_PJOK_${(S.id.sekolah || '').replace(/\s+/g, '_')}.doc`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function printHtml(html, land) {
  const w = window.open('', '_blank'); if (!w) return alert('Izinkan pop-up untuk mencetak.');
  w.document.write(`<html><head><meta charset="utf-8"><style>@page{size:A4 ${land ? 'landscape' : 'portrait'};margin:15mm}body{font-family:'Times New Roman';font-size:12pt}table{border-collapse:collapse;width:100%}td,th{border:1px solid #000;padding:4px;vertical-align:top}th{background:#d9e2f3;-webkit-print-color-adjust:exact}table.nb td,table.nb th{border:none}</style></head><body>${html}</body></html>`);
  w.document.close(); setTimeout(() => w.print(), 400);
}

/* ---------- render & events ---------- */
function render() {
  if (!S) return;
  $('#nav').innerHTML = MENUS.map(([k, t]) => `<button class="${k === cur ? 'on' : ''}" data-act="go" data-k="${k}">${t}</button>`).join('');
  $('#kelasSel').innerHTML = [1, 2, 3, 4, 5, 6].map(k => `<option value="${k}" ${String(S.kelasAktif) === String(k) ? 'selected' : ''}>Kelas ${k} (Fase ${faseOf(k)})</option>`).join('');
  $('#kelasSel').onchange = e => switchKelas(e.target.value);
  $('#view').innerHTML = VIEWS[cur]();
  $('#who').innerHTML = user ? `${esc(user.email)} <button class="btn" data-act="logout">Keluar</button>` : (hasSB ? '' : 'Mode lokal (Supabase belum diatur)');
  if (DOCS[cur]) gen(cur);
  if (cur === 'kaldik') kalRefresh();
}
function gen(id) { const el = $('#prev-' + id); if (el) el.innerHTML = DOCS[id].build(); }
function kalRefresh() {
  const c = kaldikCalc(); c.rows.forEach((r, i) => { const a = $('#ef' + i), b = $('#jm' + i); if (a) a.textContent = r.ef; if (b) b.textContent = r.jam; });
  const s = $('#kalsum'); if (s) s.innerHTML = `Semester 1: <b>${c.s1.ef}</b> minggu efektif = <b>${c.s1.jam}</b> JP • Semester 2: <b>${c.s2.ef}</b> minggu efektif = <b>${c.s2.jam}</b> JP • Setahun: <b>${c.s1.jam + c.s2.jam}</b> JP`;
  gen('kaldik');
}
document.addEventListener('input', e => {
  const t = e.target, k = t.dataset.k; if (!k) return;
  sp(k, t.dataset.num ? (+t.value || 0) : t.value); save();
  if (t.dataset.hook === 'kal') kalRefresh();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.k && t.dataset.re) { if (t.dataset.k === 'cp.fase') S.cp.kelas = FASE[S.cp.fase][0]; if (t.dataset.k === 'soal.jenis') { const p = PRESET[S.soal.jenis]; S.soal.pg = p[0]; S.soal.isian = p[1]; S.soal.uraian = p[2]; } save(); render(); }
  else if (t.dataset.k && t.tagName === 'SELECT') { save(); }
  if (t.dataset.upload && t.files[0]) handleUpload(t.dataset.upload, t.files[0]);
  if (t.dataset.img && t.files[0]) resizeImg(t.files[0], +t.dataset.max || 500, t.dataset.fmt || 'png').then(d => { sp(t.dataset.img, d); save(); render(); });
});
function resizeImg(file, max = 500, fmt = 'png') {
  return new Promise(res => { const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => { const sc = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * sc; c.height = im.height * sc; const g = c.getContext('2d'); if (fmt === 'jpeg') { g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); } g.drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/' + fmt, 0.85)); }; im.src = r.result; }; r.readAsDataURL(file); });
}
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return; const d = b.dataset, a = d.act;
  if (a === 'go') { cur = d.k; render(); $('.side').classList.remove('open'); }
  else if (a === 'gen') gen(d.id);
  else if (a === 'dl') toWord(DOCS[d.id].title, $('#prev-' + d.id).innerHTML, DOCS[d.id].land);
  else if (a === 'print') printHtml($('#prev-' + d.id).innerHTML, DOCS[d.id].land);
  else if (a === 'addTp') { S.tp.push({ sem: 1, elemen: ELEMEN[0], materi: '', tp: '', jp: 4, dimensi: '' }); save(); render(); }
  else if (a === 'delTp') { S.tp.splice(+d.i, 1); save(); render(); }
  else if (a === 'upTp') { const i = +d.i; if (i > 0) { [S.tp[i - 1], S.tp[i]] = [S.tp[i], S.tp[i - 1]]; save(); render(); } }
  else if (a === 'sample') { addSample(); save(); render(); }
  else if (a === 'bahanTp') {
    const t = bahanTitles(); if (!t.length) return alert('Judul Bab/Unit tidak ditemukan pada berkas. Gunakan file .csv atau isi TP manual.');
    t.forEach((m, n) => S.tp.push({ sem: n < Math.ceil(t.length / 2) ? 1 : 2, elemen: ELEMEN[0], materi: m, tp: tpText(m, 0), jp: 8, dimensi: 'Kesehatan, Kolaborasi, Kemandirian' })); save(); render(); alert(t.length + ' TP dibuat dari judul Bab. Periksa dan edit seperlunya.');
  }
  else if (a === 'delBahan') { S.bahan = null; save(); render(); }
  else if (a === 'wk') { const k = d.mi + '-' + d.w; S.promes.off[k] = weekOff(+d.mi, +d.w) ? 0 : 1; save(); render(); }
  else if (a === 'resetWk') { S.promes.off = {}; save(); render(); }
  else if (a === 'addJ') { S.jurnal.push({ tgl: '', jam: '', kelas: S.cp.kelas, pert: '', materi: '', absen: '', tuntas: '', kendala: '', tl: '' }); save(); render(); }
  else if (a === 'delJ') { S.jurnal.splice(+d.i, 1); save(); render(); }
  else if (a === 'delImg') { sp(d.p, ''); save(); render(); }
  else if (a === 'delFile') { const f = S.files[+d.i]; if (f.path && sb) await sb.storage.from('berkas').remove([f.path]); S.files.splice(+d.i, 1); save(); render(); }
  else if (a === 'getFile') { const { data } = await sb.storage.from('berkas').createSignedUrl(S.files[+d.i].path, 120); if (data) window.open(data.signedUrl, '_blank'); }
  else if (a === 'logout') { await sb.auth.signOut(); location.reload(); }
});
$('#burger').onclick = () => $('.side').classList.toggle('open');
